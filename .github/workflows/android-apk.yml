name: Android APK Auto-Build
#目的：无需本地环境，在 GitHub Actions 上从源码构建出可安装的 Cindy Android APK
on:
  workflow_dispatch:
    inputs:
      region:
        description: "构建地区 (cn / global)"
        type: choice
        options: [cn, global]
        default: cn
      variant:
        description: "构建类型 (debug / release)"
        type: choice
        options: [debug, release]
        default: debug
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "apps/mobile/**"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Cindy APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 跳过桌面端大件：aagent/binaries 与 electron，手机端构建用不上
      XDT_SKIP_AGENT_BIN_INSTALL: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_CINDY_AUTH_REGION: ${{ inputs.region || 'cn' }}
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK tooling
        run: |
          sudo rm -rf /usr/local/lib/android || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Generate self-host-regions.json (CI-only, not committed)
        run: |
          cat > apps/mobile/scripts/self-host-regions.json <<'JSON'
          {
            "cn": {
              "authRegion": "cn",
              "iosBundleId": "com.xd.cindycn",
              "iosAppStoreId": "",
              "androidPackage": "com.xd.cindycn",
              "androidStoreUrl": "",
              "npkgExpectBundle": "",
              "tapdb": { "clientId": "ci-placeholder", "clientToken": "ci-placeholder" },
              "oss": { "cdnBaseUrl": "", "bucket": "", "prefix": "", "ossRegion": "" },
              "iosSigning": { "teamId": "", "profileName": "", "signIdentity": "", "profilePath": "", "exportMethod": "" },
              "androidSigning": { "keyAlias": "cindy", "keystorePath": "/tmp/cindy.keystore" }
            },
            "global": {
              "authRegion": "global",
              "iosBundleId": "com.xd.cindy",
              "iosAppStoreId": "",
              "androidPackage": "com.xd.cindy",
              "androidStoreUrl": "",
              "npkgExpectBundle": "",
              "google": { "webClientId": "", "iosClientId": "", "iosUrlScheme": "" },
              "tapdb": { "clientId": "ci-placeholder", "clientToken": "ci-placeholder" },
              "oss": { "cdnBaseUrl": "", "bucket": "", "prefix": "", "ossRegion": "" },
              "iosSigning": { "teamId": "", "profileName": "", "signIdentity": "", "profilePath": "", "exportMethod": "" },
              "androidSigning": { "keyAlias": "cindy", "keystorePath": "/tmp/cindy.keystore" }
            },
            "dev": {
              "authRegion": "dev",
              "iosBundleId": "com.xd.cindycn",
              "iosAppStoreId": "",
              "androidPackage": "com.xd.cindycn",
              "androidStoreUrl": "",
              "npkgExpectBundle": "",
              "tapdb": { "clientId": "ci-placeholder", "clientToken": "ci-placeholder" },
              "oss": { "cdnBaseUrl": "", "bucket": "", "prefix": "", "ossRegion": "" },
              "iosSigning": { "teamId": "", "profileName": "", "signIdentity": "", "profilePath": "", "exportMethod": "" },
              "androidSigning": { "keyAlias": "cindy", "keystorePath": "/tmp/cindy.keystore" }
            }
          }
          JSON

      - name: Generate signing keystore (ephemeral, CI-only)
        run: |
          keytool -genkeypair -v -keystore /tmp/cindy.keystore -storepass cindy123 \
            -keypass cindy123 -alias cindy -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Cindy CI, O=CI, C=CN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild -p android --no-install

      - name: Gradle build
        working-directory: apps/mobile/android
        env:
          XDT_ANDROID_KEYSTORE_PASSWORD_CN: cindy123
          XDT_ANDROID_KEY_PASSWORD_CN: cindy123
          XDT_ANDROID_KEYSTORE_PASSWORD_GLOBAL: cindy123
          XDT_ANDROID_KEY_PASSWORD_GLOBAL: cindy123
        run: |
          if [ "${{ inputs.variant || 'debug' }}" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew "$TASK" --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g"

      - name: Collect APK
        run: |
          mkdir -p out
          find apps/mobile/android -name "*.apk" -print -exec cp {} out/ \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cindy-android-${{ inputs.region || 'cn' }}-${{ inputs.variant || 'debug' }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo "- region: ${{ inputs.region || 'cn' }}  variant: ${{ inputs.variant || 'debug' }}" >> "$GITHUB_STEP_SUMMARY"
          ls out/*.apk 2>/dev/null | while read f; do echo "- \`$f\` ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"; done
