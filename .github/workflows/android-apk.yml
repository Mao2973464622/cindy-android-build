name: Android APK Auto-Build
# 由上游自带脚本 apps/mobile/scripts/build-android.mjs 出自签 release APK
# （内置 JS bundle，可离线安装；含 R8 优化、fingerprint/runtimeVersion 回读校验）
on:
  workflow_dispatch:
    inputs:
      region:
        description: "构建地区（cn=中国大陆端点 / global=全球端点）"
        type: choice
        options: [cn, global]
        default: cn
      abis:
        description: "目标 ABI（arm64-v8a 构建最快；K70 等现代机型够用）"
        type: choice
        options: [arm64-v8a, "arm64-v8a,armeabi-v7a", all]
        default: arm64-v8a
      desktopVersion:
        description: "配对桌面版本号（可选，仅设置页展示）"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}-${{ github.event.inputs.region || 'cn' }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build (${{ github.event.inputs.region || 'cn' }} · ${{ github.event.inputs.abis || 'arm64-v8a' }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      XDT_SKIP_AGENT_BIN_INSTALL: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      EXPO_NO_TELEMETRY: "1"
      CI: "false"
      NODE_OPTIONS: "--max-old-space-size=8192"
      BUILD_REGION: ${{ github.event.inputs.region || 'cn' }}
      BUILD_ABIS: ${{ github.event.inputs.abis || 'arm64-v8a' }}
      DESKTOP_VERSION: ${{ github.event.inputs.desktopVersion || '' }}
    steps:
      - name: Free disk space (keep Android SDK)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          [ -z "$SDKMGR" ] && SDKMGR=$(command -v sdkmanager || true)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "sdkmanager 未找到，依赖 AGP 自动下载"
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cindy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json') }}-${{ env.BUILD_REGION }}-${{ env.BUILD_ABIS }}
          restore-keys: |
            gradle-cindy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json') }}-
            gradle-cindy-${{ runner.os }}-

      # ORG_GRADLE_PROJECT_* 等价于命令行 -P，优先级高于 prebuild 生成的
      # android/gradle.properties（RN 模板默认四个 ABI），用来裁掉冗余架构。
      - name: Resolve gradle project properties
        run: |
          if [ "$BUILD_ABIS" = "all" ]; then
            echo "ABI=全部（RN 模板默认四个）"
          else
            echo "ORG_GRADLE_PROJECT_reactNativeArchitectures=$BUILD_ABIS" >> "$GITHUB_ENV"
            echo "ABI=$BUILD_ABIS"
          fi

      - name: Generate CI keystore (自签，一次性)
        run: |
          rm -f "$RUNNER_TEMP/ci.keystore"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci.keystore" \
            -alias cindy-ci -keyalg RSA -keysize 2048 -validity 1095 \
            -storepass cindy-ci-pass -keypass cindy-ci-pass \
            -dname "CN=Cindy CI, OU=Community Build, O=CI, L=Internet, C=CN"
          ls -l "$RUNNER_TEMP/ci.keystore"

      - name: Write self-host-regions.json
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci.keystore
        run: node .ci/write-regions.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release APK (upstream build-android.mjs)
        id: build
        working-directory: apps/mobile
        env:
          XDT_ANDROID_KEYSTORE_PASSWORD_CN: "cindy-ci-pass"
          XDT_ANDROID_KEY_PASSWORD_CN: "cindy-ci-pass"
          XDT_ANDROID_KEYSTORE_PASSWORD_GLOBAL: "cindy-ci-pass"
          XDT_ANDROID_KEY_PASSWORD_GLOBAL: "cindy-ci-pass"
        run: |
          set -o pipefail
          ARGS=(--region "$BUILD_REGION" --artifacts apk --execute --skip-git-gate)
          if [ -n "$DESKTOP_VERSION" ]; then ARGS+=(--desktop-version "$DESKTOP_VERSION"); fi
          node scripts/build-android.mjs "${ARGS[@]}" --out "$GITHUB_WORKSPACE/out" 2>&1 | tee /tmp/build.log

      - name: Verify artifacts (必须内置 JS bundle)
        run: node .ci/verify-apk.cjs

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cindy-android-${{ env.BUILD_REGION }}-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling Release (public direct link)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=android-preview
          APK="${APK_FILE:-$(ls out/*.apk | head -1)}"
          VER=$(node -e "console.log(require('./apps/mobile/app.json').expo.version)")
          gh release create "$TAG" \
            --title "Cindy Android Preview (auto build v$VER)" \
            --notes "GitHub Actions 自动构建：region=$BUILD_REGION, abi=$BUILD_ABIS, commit=$GITHUB_SHA。自签 release 包（内置 JS bundle，可离线运行），与官方签名不通用、不能覆盖安装官方版。" \
            --prerelease 2>/dev/null || true
          gh release upload "$TAG" "$APK" --clobber
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$APK")"
          echo "### 直链下载" >> "$GITHUB_STEP_SUMMARY"
          echo "- [$APK]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: v$VER · region: $BUILD_REGION · abi: $BUILD_ABIS" >> "$GITHUB_STEP_SUMMARY"

      - name: Failure diagnostics
        if: failure()
        run: |
          echo '### 构建日志尾部' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 /tmp/build.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '--- versions ---'; node -v; pnpm -v; java -version 2>&1 | head -2
          echo '--- df ---'; df -h /
          echo '--- android dir ---'; ls apps/mobile/android 2>/dev/null || echo MISSING
          find ~/.gradle -name '*.log' 2>/dev/null | head -2 | while read -r f; do
            echo "== $f"; tail -n 60 "$f"; done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Cindy Android · $BUILD_REGION · $BUILD_ABIS"
            echo "- commit: \`$GITHUB_SHA\`"
            ls -lh out/*.apk 2>/dev/null | awk '{print "- APK: " $9 " (" $5 ")"}'
          } >> "$GITHUB_STEP_SUMMARY"
