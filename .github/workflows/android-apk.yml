name: Android APK Auto-Build
# 从源码自动构建可安装的 Cindy Android APK（debug 签名），无需本地环境。
on:
  workflow_dispatch:
    inputs:
      region:
        description: "构建地区"
        type: choice
        options: [cn, global]
        default: cn
      variant:
        description: "构建类型（debug 免签名依赖，先保证出包）"
        type: choice
        options: [debug, release]
        default: debug
  push:
    paths:
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Cindy APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      XDT_SKIP_AGENT_BIN_INSTALL: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      EXPO_NO_TELEMETRY: "1"
      CI: "false"
      EXPO_PUBLIC_CINDY_AUTH_REGION: ${{ inputs.region || 'cn' }}
      NODE_OPTIONS: "--max-old-space-size=8192"
    steps:
      - name: Free disk space (KEEP Android SDK)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/ndk-* || true
          echo "ANDROID_HOME=$ANDROID_HOME"; echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          df -h /
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK root: $SDK"; ls -d "$SDK" || true
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          [ -z "$SDKMGR" ] && SDKMGR=$(command -v sdkmanager || true)
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found; rely on AGP auto-download"; exit 0; fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDKMGR" --list_installed 2>/dev/null | head -30 || true
      - name: Generate self-host-regions.json
        run: node ./.ci-write-regions.cjs || node -e "require('fs').writeFileSync('apps/mobile/scripts/self-host-regions.json',JSON.stringify({cn:{authRegion:'cn',iosBundleId:'com.xd.cindycn',iosAppStoreId:'',androidPackage:'com.xd.cindycn',androidStoreUrl:'',npkgExpectBundle:'',tapdb:{clientId:'ci',clientToken:'ci'},oss:{cdnBaseUrl:'',bucket:'',prefix:'',ossRegion:''},iosSigning:{teamId:'',profileName:'',signIdentity:'',profilePath:'',exportMethod:''},androidSigning:{keyAlias:'cindy',keystorePath:'/tmp/cindy.keystore'}},global:{authRegion:'global',iosBundleId:'com.xd.cindy',iosAppStoreId:'',androidPackage:'com.xd.cindy',androidStoreUrl:'',npkgExpectBundle:'',google:{webClientId:'',iosClientId:'',iosUrlScheme:''},tapdb:{clientId:'ci',clientToken:'ci'},oss:{cdnBaseUrl:'',bucket:'',prefix:'',ossRegion:''},iosSigning:{teamId:'',profileName:'',signIdentity:'',profilePath:'',exportMethod:''},androidSigning:{keyAlias:'cindy',keystorePath:'/tmp/cindy.keystore'}},dev:{authRegion:'dev',iosBundleId:'com.xd.cindycn',iosAppStoreId:'',androidPackage:'com.xd.cindycn',androidStoreUrl:'',npkgExpectBundle:'',tapdb:{clientId:'ci',clientToken:'ci'},oss:{cdnBaseUrl:'',bucket:'',prefix:'',ossRegion:''},iosSigning:{teamId:'',profileName:'',signIdentity:'',profilePath:'',exportMethod:''},androidSigning:{keyAlias:'cindy',keystorePath:'/tmp/cindy.keystore'}}},null,2));console.log('regions written')"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild -p android --no-install
      - name: Gradle build
        working-directory: apps/mobile/android
        run: |
          if [ "${{ inputs.variant || 'debug' }}" = "release" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          echo "Task: $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          find apps/mobile/android -name "*.apk" -print -exec cp -v {} out/ \;
          echo '--- artifacts ---'; ls -la out/ || true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cindy-android-${{ inputs.region || 'cn' }}-${{ inputs.variant || 'debug' }}
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 30
      - name: Failure diagnostics
        if: failure()
        run: |
          echo '### diag' >> "$GITHUB_STEP_SUMMARY"
          echo '--- versions ---'; node -v; pnpm -v; java -version 2>&1 | head -2
          echo '--- android dir ---'; ls apps/mobile/android 2>/dev/null || echo MISSING
          echo '--- gradle logs tail ---'; find ~/.gradle -name '*.log' 2>/dev/null | head -3 | while read f; do echo "== $f"; tail -n 60 "$f"; done
      - name: Publish rolling Release (public direct link)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-preview
          APK=$(ls out/*.apk | head -1)
          [ -z "$APK" ] && { echo "no apk to publish"; exit 0; }
          gh release create "$TAG" \
            --title "Cindy Android Preview (auto-build)" \
            --notes "由 GitHub Actions 自动构建，每次成功自动覆盖。debug 签名，可直接安装。commit: ${{ github.sha }}" \
            --prerelease 2>/dev/null || true
          gh release upload "$TAG" "$APK" --clobber
          echo "### 下载地址" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$APK")" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          echo "## Cindy Android 构建 · ${{ inputs.region || 'cn' }} / ${{ inputs.variant || 'debug' }}" >> "$GITHUB_STEP_SUMMARY"
          ls out/*.apk 2>/dev/null | while read f; do echo "- OK: \`$f\` ($(du -h "$f"|cut -f1)) → 到 Artifacts 下载" >> "$GITHUB_STEP_SUMMARY"; done
